name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check-and-test:
    name: Check, Clippy and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo check
        run: cargo check --lib --bins --tests

      - name: cargo clippy
        run: cargo clippy --no-deps -- -D warnings

      - name: cargo test (library)
        run: cargo test --lib --release

  avx2-tests:
    name: AVX2 SIMD Tests (math-dsp, x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-avx2-${{ hashFiles('**/Cargo.lock') }}

      # Compile-only gate: guarantees the AVX2 kernels build even if the
      # runner's CPU support ever changes.
      - name: cargo check math-dsp with AVX2
        run: cargo check -p math-dsp --all-targets
        env:
          RUSTFLAGS: -C target-feature=+avx2

      # ubuntu-latest runners support AVX2, so the kernels are executed.
      - name: cargo test math-dsp with AVX2
        run: cargo test -p math-dsp
        env:
          RUSTFLAGS: -C target-feature=+avx2

  qa:
    name: Workspace QA
    runs-on: ubuntu-latest
    needs: check-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Just
        uses: extractions/setup-just@v4

      - name: Run workspace QA
        run: just qa

  coverage-gate:
    name: Library Unit-Test Coverage Gate (90 %)
    runs-on: ubuntu-latest
    needs: check-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}

      - name: Run coverage gate
        run: cargo llvm-cov --lib --summary-only --release --fail-under-lines 90
