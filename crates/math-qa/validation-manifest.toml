# math-qa validation manifest: every release-grade Wolfram comparison.
#
# Only manifest-listed cases may support accuracy claims. Each case needs
# a `.wls` oracle, a checked-in golden (produced with `just qa-goldens`),
# and a `tests/` comparison target below.
# allowance_sha256 pins the ordered paths and f64 values of oracle tolerance
# fields, as computed by allowance_digest; review changes to those values.
# Normalized cases also pin named numerical allowances for raw component
# maxima, including the fixed RMS and scaled impulse tolerances. Review both
# the digest and the allowance map when updating an oracle.

[[case]]
id = "math-qa.biquad-response.v1"
owner = "math-iir-fir"
script = "biquad_response.wls"
golden = "biquad_response.json"
allowance_sha256 = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
test = "wolfram_biquad_response"
metric = "complex_response_relative_error"
unit = "ratio"
limit = 1e-9
tolerance = "complex relative error <= 1e-9"
tier = "smoke"

