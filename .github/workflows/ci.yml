name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check-and-test:
    name: Check, Clippy and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # .cargo/config.toml links Linux x86_64 with clang + -fuse-ld=mold,
      # which are not preinstalled on ubuntu-latest.
      - name: Install clang and mold linker
        timeout-minutes: 10
        # apt mirrors on shared runners intermittently hang; bound each
        # attempt and retry instead of stalling the job for hours.
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update \
              && sudo apt-get install -y clang mold; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying"
            sleep 15
          done
          exit 1

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo check
        run: cargo check --lib --bins --tests

      - name: cargo clippy
        run: cargo clippy --no-deps -- -D warnings

      - name: cargo test (library)
        run: cargo test --lib --release

  avx2-tests:
    name: SIMD Tests (DSP/FIR, x86_64, ${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "+avx2,+fma"
            slug: avx2-fma
            features: "+avx2,+fma"
          - label: "+avx2,-fma"
            slug: avx2-nofma
            features: "+avx2,-fma"
          - label: "-avx2,-fma"
            slug: noavx2-nofma
            features: "-avx2,-fma"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install clang and mold linker
        timeout-minutes: 10
        # apt mirrors on shared runners intermittently hang; bound each
        # attempt and retry instead of stalling the job for hours.
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update \
              && sudo apt-get install -y clang mold; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying"
            sleep 15
          done
          exit 1

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Cache keys cannot contain commas, so use the comma-free slug
          # instead of the raw feature list.
          key: ${{ runner.os }}-cargo-simd-${{ matrix.slug }}-${{ hashFiles('**/Cargo.lock') }}

      # Compile-only gate: guarantees the AVX2 kernels build even if the
      # runner's CPU support ever changes.
      - name: cargo check DSP and FIR feature paths
        run: cargo check -p math-dsp -p math-iir-fir --all-targets
        env:
          RUSTFLAGS: -C target-feature=${{ matrix.features }}

      # ubuntu-latest runners support AVX2, so the kernels are executed.
      - name: cargo test DSP and FIR feature paths
        run: cargo test -p math-dsp -p math-iir-fir --release
        env:
          RUSTFLAGS: -C target-feature=${{ matrix.features }}

      - name: Historical FIR negative controls
        if: matrix.slug == 'avx2-fma'
        run: python3 qa/fir-negative-controls/run.py

  qa:
    name: Workspace QA
    runs-on: ubuntu-latest
    needs: check-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install clang and mold linker
        timeout-minutes: 10
        # apt mirrors on shared runners intermittently hang; bound each
        # attempt and retry instead of stalling the job for hours.
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update \
              && sudo apt-get install -y clang mold; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying"
            sleep 15
          done
          exit 1

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Just
        uses: extractions/setup-just@v4

      - name: Run workspace QA
        run: just qa

  coverage-gate:
    name: Test Coverage Gate (81 %)
    runs-on: ubuntu-latest
    needs: check-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install clang and mold linker
        timeout-minutes: 10
        # apt mirrors on shared runners intermittently hang; bound each
        # attempt and retry instead of stalling the job for hours.
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update \
              && sudo apt-get install -y clang mold; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying"
            sleep 15
          done
          exit 1

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}

      - name: Run coverage gate
        # Keep in sync with the `qa` recipe in Justfile (bins included).
        run: |
          cargo llvm-cov clean --workspace
          CARGO_PROFILE_RELEASE_OPT_LEVEL=0 cargo llvm-cov --summary-only --release --fail-under-lines 81 --ignore-filename-regex 'rustlib/src/rust|registry/src'
